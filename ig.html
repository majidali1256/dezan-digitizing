  })(window,document,'script','dataLayer','GTM-5K8L9W2');</script>
  <!-- End Google Tag Manager -->

  <!-- Instant Clean Attribution Capture & Redirect Engine -->
  <script>
    (function () {
      var channel = 'instagram';
      var defaultMedium = 'organic_social';
      var defaultCampaign = 'profile_bio';

      var urlParams = new URLSearchParams(window.location.search);
      var destination = urlParams.get('dest') || urlParams.get('to') || urlParams.get('redirect') || '/';
      
      var utmSource = urlParams.get('utm_source') || channel;
      var utmMedium = urlParams.get('utm_medium') || defaultMedium;
      var utmCampaign = urlParams.get('utm_campaign') || defaultCampaign;
      var utmContent = urlParams.get('utm_content') || null;
      var utmTerm = urlParams.get('utm_term') || null;
      var gclid = urlParams.get('gclid') || null;
      var gbraid = urlParams.get('gbraid') || null;
      var wbraid = urlParams.get('wbraid') || null;
      var referrer = document.referrer || 'instagram.com';
      var landingPage = window.location.pathname || '/ig';
      var nowIso = new Date().toISOString();

      var trackingObj = {
        source: channel,
        landing_page: landingPage,
        referral_source: referrer,
        utm_source: utmSource,
        utm_medium: utmMedium,
        utm_campaign: utmCampaign,
        utm_content: utmContent,
        utm_term: utmTerm,
        gclid: gclid,
        gbraid: gbraid,
        wbraid: wbraid,
        captured_at: nowIso
      };

      // 1. Persist to localStorage (First Touch + Last Touch)
      try {
        var existingFirst = localStorage.getItem('dezan_first_touch_attribution');
        if (!existingFirst) {
          localStorage.setItem('dezan_first_touch_attribution', JSON.stringify(trackingObj));
        }
        localStorage.setItem('dezan_last_touch_attribution', JSON.stringify(trackingObj));
        sessionStorage.setItem('dezan_current_session_attribution', JSON.stringify(trackingObj));
      } catch (_) {}

      // 2. Persist to 90-Day Root-Scoped Cookies
      try {
        var d = new Date();
        d.setTime(d.getTime() + (90 * 24 * 60 * 60 * 1000));
        var expires = '; expires=' + d.toUTCString();
        var jsonStr = encodeURIComponent(JSON.stringify(trackingObj));
        document.cookie = 'dezan_last_touch=' + jsonStr + expires + '; path=/; SameSite=Lax';
        document.cookie = 'dezan_tracking_data=' + jsonStr + expires + '; path=/; SameSite=Lax';
        if (!document.cookie.includes('dezan_first_touch=')) {
          document.cookie = 'dezan_first_touch=' + jsonStr + expires + '; path=/; SameSite=Lax';
        }
      } catch (_) {}

      // 3. Dispatch to GTM dataLayer
      window.dataLayer = window.dataLayer || [];
      window.dataLayer.push({
        event: 'clean_tracking_redirect',
        channel: channel,
        utm_source: utmSource,
        utm_medium: utmMedium,
        utm_campaign: utmCampaign,
        destination: destination,
        timestamp: nowIso
      });

      // 4. Instant seamless redirect (zero history stack pollution)
      if (typeof window !== 'undefined' && window.location) {
        window.location.replace(destination);
      }
    })();
  </script>
